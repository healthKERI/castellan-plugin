# pyproject.toml

[build-system]

requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CastellanPlugin"
version = "0.0.1"
description = "Castellan plugin for Locksmith application to communicate with Castellan server."
readme = "README.md"
requires-python = ">=3.12.9"
license = { text = "MIT" }

authors = [
    { name = "Ari Argoud", email = "ariargoud@gmail.com" },
    { name = "Phillip Feairheller", email = "pfeairheller@gmail.com" },
]

keywords = ["healthKERI", "cryptography", "KERI", "ACDC"]

classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "locksmith>=0.0.1",
    "httpx==0.28.1"
]


[project.entry-points."locksmith.plugins"]
castellan = "castellan.plugin:CastellanPlugin"


[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
